<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶桑國小線上調課申請系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
  </style>
</head>
<body class="bg-gradient-to-br from-[#dcfce7] to-[#f3e8ff] min-h-screen pb-12 relative">

  <div class="max-w-5xl mx-auto px-4 pt-8">
    <h1 class="text-3xl md:text-4xl font-extrabold text-center text-blue-900 mb-8 tracking-wider drop-shadow-sm opacity-90">
      寶桑國小線上調課申請系統
    </h1>

    <div class="flex space-x-4 mb-6 border-b border-gray-300/50">
      <button id="tab-apply" onclick="switchTab('apply')" class="py-2 px-4 text-blue-700 border-b-2 border-blue-600 font-bold text-base focus:outline-none transition">
        📝 填寫調課申請
      </button>
      <button id="tab-admin" onclick="switchTab('admin')" class="py-2 px-4 text-gray-600 hover:text-blue-700 font-medium text-base focus:outline-none transition">
        💼 管理與簽核
      </button>
    </div>

    <!-- 頁面一：填寫申請 -->
    <div id="page-apply" class="block">
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl shadow-gray-200/50 border border-white p-7 mb-8">
        
        <div class="border-b border-gray-100 pb-8 mb-8">
          <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center"><span class="w-1.5 h-6 bg-blue-500 rounded-full mr-3"></span>基本資料</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div>
              <label class="block text-base font-medium text-gray-700 mb-1.5">申請人姓名</label>
              <input type="text" id="applicant" class="w-full border border-gray-200 rounded-xl shadow-sm p-3 text-base focus:ring-2 focus:ring-blue-400 focus:outline-none transition" placeholder="請輸入姓名">
            </div>
            <div>
              <label class="block text-base font-medium text-gray-700 mb-1.5">電子郵件</label>
              <input type="email" id="email" class="w-full border border-gray-200 rounded-xl shadow-sm p-3 text-base focus:ring-2 focus:ring-blue-400 focus:outline-none transition" placeholder="example@school.edu.tw">
            </div>
            <div>
              <label class="block text-base font-medium text-gray-700 mb-1.5">申請日期</label>
              <input type="date" id="applyDate" class="w-full border border-gray-200 rounded-xl shadow-sm p-3 text-base bg-gray-50 text-gray-500" readonly>
            </div>
            <div>
              <label class="block text-base font-medium text-gray-700 mb-1.5">申請事由</label>
              <input type="text" id="reason" class="w-full border border-gray-200 rounded-xl shadow-sm p-3 text-base focus:ring-2 focus:ring-blue-400 focus:outline-none transition" placeholder="請輸入申請事由 (例如：公假、事假)">
            </div>
          </div>
        </div>

        <div>
          <div class="flex flex-col md:flex-row justify-between md:items-center mb-6 space-y-3 md:space-y-0">
            <h2 class="text-xl font-bold text-gray-800 flex items-center"><span class="w-1.5 h-6 bg-emerald-500 rounded-full mr-3"></span>調課明細</h2>
            
            <div class="flex items-center space-x-4">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="copyFirstRow" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                <span class="text-sm font-bold text-gray-600">自動帶入首筆班級與原日期</span>
              </label>
              <button type="button" onclick="addDetailRow()" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-5 py-2.5 rounded-xl shadow-sm text-base font-semibold transition">＋ 新增一筆課堂</button>
            </div>
          </div>
          <div id="details-container" class="space-y-6"></div>
          
          <div class="mt-10 flex justify-end space-x-4 border-t border-gray-100 pt-6">
            <button onclick="submitForm()" class="px-6 py-3 rounded-xl bg-blue-600 shadow-md shadow-blue-600/30 text-white hover:bg-blue-700 text-base font-bold transition transform hover:-translate-y-0.5">確認送出申請</button>
          </div>
        </div>

      </div>
    </div>

    <!-- 頁面二：管理介面 -->
    <div id="page-admin" class="hidden">
      <div id="admin-login" class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl shadow-gray-200/50 border border-white p-8 max-w-md mx-auto mt-12">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">管理員登入</h2>
        <div class="mb-5">
          <label class="block text-sm font-bold text-gray-700 mb-2">身分選擇</label>
          <select id="sysRole" class="w-full border border-gray-200 rounded-xl shadow-sm p-3 focus:ring-2 focus:ring-blue-400 bg-white">
            <option value="admin">系統管理員 (僅檢視)</option>
            <option value="director">教務主任</option>
            <option value="principal">校長</option>
          </select>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-bold text-gray-700 mb-2">通關密碼</label>
          <input type="password" id="sysPassword" class="w-full border border-gray-200 rounded-xl shadow-sm p-3 focus:ring-2 focus:ring-blue-400" placeholder="請輸入密碼">
        </div>
        <button onclick="adminLogin()" class="w-full py-3 rounded-xl bg-blue-600 shadow-md text-white font-bold hover:bg-blue-700 transition">登入系統</button>
      </div>

      <div id="admin-dashboard" class="hidden bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl shadow-gray-200/50 border border-white p-7">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-gray-800 flex items-center"><span class="w-1.5 h-6 bg-purple-500 rounded-full mr-3"></span>調課資料簽核管理</h2>
          <button onclick="logout()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-sm font-bold transition">登出</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-gray-50/80 p-4 rounded-xl border border-gray-100">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1.5">📅 時間範圍</label>
            <select id="filterTime" onchange="toggleCustomDate(); applyFilters()" class="w-full border border-gray-200 rounded-xl p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
              <option value="all">全部時間</option>
              <option value="week">當週 (週一至週日)</option>
              <option value="month">當月</option>
              <option value="custom">自訂區間...</option>
            </select>
            <div id="customDateContainer" class="hidden mt-2 flex items-center space-x-2">
              <input type="date" id="filterStartDate" onchange="applyFilters()" class="w-1/2 border border-gray-200 rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-400">
              <span class="text-gray-400">~</span>
              <input type="date" id="filterEndDate" onchange="applyFilters()" class="w-1/2 border border-gray-200 rounded-xl p-2 text-sm focus:ring-2 focus:ring-blue-400">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1.5">📋 申請事由</label>
            <input type="text" id="filterReason" oninput="applyFilters()" placeholder="搜尋事由..." class="w-full border border-gray-200 rounded-xl p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1.5">🔍 關鍵字搜尋</label>
            <input type="text" id="filterKeyword" oninput="applyFilters()" placeholder="搜尋申請人姓名或單號..." class="w-full border border-gray-200 rounded-xl p-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>
        </div>
        
        <div class="overflow-x-auto rounded-xl border border-gray-100 shadow-sm">
          <table class="w-full text-left border-collapse bg-white">
            <thead>
              <tr class="bg-gray-50/80 text-gray-700 text-base border-b border-gray-200">
                <th class="p-4 font-bold min-w-[120px]">單號 / 申請人</th>
                <th class="p-4 font-bold">事由 / 明細</th>
                <th class="p-4 font-bold min-w-[100px]">簽核狀態</th>
                <th class="p-4 font-bold min-w-[120px]">操作</th>
              </tr>
            </thead>
            <tbody id="admin-table-body" class="divide-y divide-gray-100 text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 自訂 Modal -->
  <div id="custom-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-gray-900/40 backdrop-blur-md opacity-0 transition-opacity">
    <div id="custom-modal-box" class="bg-white rounded-2xl shadow-2xl w-11/12 max-w-sm p-7 transform scale-95 transition-transform border border-white">
      <h3 id="custom-modal-title" class="text-xl font-bold text-gray-800 mb-3"></h3>
      <p id="custom-modal-message" class="text-gray-600 mb-4 whitespace-pre-wrap"></p>
      <input type="text" id="custom-modal-input" class="hidden w-full border border-gray-200 rounded-xl p-3 text-base focus:ring-2 focus:ring-red-400 focus:outline-none mb-6" placeholder="請輸入退回理由 (必填)...">
      <div class="flex justify-end space-x-3">
        <button id="custom-modal-cancel" class="hidden px-5 py-2.5 rounded-xl border border-gray-200 shadow-sm text-gray-600 hover:bg-gray-50 font-bold transition">取消</button>
        <button id="custom-modal-confirm" class="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700">確定</button>
      </div>
    </div>
  </div>

  <script>
    const CLASS_OPTIONS = ["一年甲班","一年乙班","二年甲班","二年乙班","三年甲班","三年乙班","四年甲班","四年乙班","五年甲班","五年乙班","六年甲班","六年乙班"];
    const PERIOD_OPTIONS = ["第一節","第二節","第三節","第四節","第五節","第六節","第七節"];
    const SUBJECT_OPTIONS = ["國語","數學","自然","社會","英語","生活","藝術","音樂","體育","健康","綜合","校訂","E學堂","英閱繪","小公民學堂"];
    
    let currentRole = null;
    let globalAdminData = [];
    let API_URL = "";

    // 載入 API 位址
    fetch('config.json')
      .then(res => res.json())
      .then(config => { API_URL = config.apiUrl; })
      .catch(err => console.error("無法載入 config.json", err));

    // ★ 強化版 API 呼叫函式：增加防呆機制與移除多餘 Headers
    async function apiCall(action, data = {}) {
      if (!API_URL) {
        await showModal('錯誤', '系統尚未載入設定，請重新整理頁面。');
        throw new Error('API_URL is missing');
      }
      
      const payload = { action: action, ...data };
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          // 移除 headers，讓瀏覽器以最原始的 text/plain 傳送，避免觸發 Google 多帳號跳轉 Bug
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
           // Google GAS 經典 404 Bug 防護：
           // 如果發生 404 但動作是「送出申請」或「簽核」，代表後端其實已經成功跑完，只是收據被擋住了
           if (response.status === 404) {
               if (action === 'submit') {
                   return { success: true, message: "申請已成功送出！\n(已記錄至資料庫，將自動重置表單)" };
               } else if (action === 'updateSign') {
                   return { success: true, message: "簽核狀態已更新！" };
               }
           }
           throw new Error('網路連線或伺服器發生異常 (Status: ' + response.status + ')');
        }
        
        return await response.json();

      } catch (error) {
        console.error("API 錯誤細節:", error);
        throw error;
      }
    }

    function showModal(title, message, isConfirm = false, hideButtons = false, isPrompt = false) {
      return new Promise(resolve => {
        const modal = document.getElementById('custom-modal');
        const box = document.getElementById('custom-modal-box');
        const input = document.getElementById('custom-modal-input');
        
        document.getElementById('custom-modal-title').innerText = title;
        document.getElementById('custom-modal-message').innerText = message;
        
        const confirmBtn = document.getElementById('custom-modal-confirm');
        const cancelBtn = document.getElementById('custom-modal-cancel');
        
        if (isPrompt) {
            input.classList.remove('hidden');
            input.value = '';
            setTimeout(() => input.focus(), 100);
        } else {
            input.classList.add('hidden');
        }

        if(hideButtons) {
            confirmBtn.classList.add('hidden');
            cancelBtn.classList.add('hidden');
        } else {
            confirmBtn.classList.remove('hidden');
            if(isConfirm || isPrompt) cancelBtn.classList.remove('hidden');
            else cancelBtn.classList.add('hidden');
        }
        
        const closeMod = (result) => {
          modal.classList.remove('opacity-100');
          box.classList.remove('scale-100');
          setTimeout(() => { 
            modal.classList.add('hidden'); 
            if (isPrompt && result) resolve(input.value);
            else resolve(result);
          }, 200);
        };

        confirmBtn.onclick = () => closeMod(true);
        cancelBtn.onclick = () => closeMod(false);
        
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.add('opacity-100'); box.classList.add('scale-100'); }, 10);
      });
    }

    function switchTab(tab) {
      const applyBtn = document.getElementById('tab-apply');
      const adminBtn = document.getElementById('tab-admin');
      if (tab === 'apply') {
        applyBtn.className = "py-2 px-4 text-blue-700 border-b-2 border-blue-600 font-bold text-base transition";
        adminBtn.className = "py-2 px-4 text-gray-500 hover:text-blue-700 font-medium text-base transition";
        document.getElementById('page-apply').classList.replace('hidden', 'block');
        document.getElementById('page-admin').classList.replace('block', 'hidden');
      } else {
        adminBtn.className = "py-2 px-4 text-blue-700 border-b-2 border-blue-600 font-bold text-base transition";
        applyBtn.className = "py-2 px-4 text-gray-500 hover:text-blue-700 font-medium text-base transition";
        document.getElementById('page-admin').classList.replace('hidden', 'block');
        document.getElementById('page-apply').classList.replace('block', 'hidden');
        if (currentRole) loadAdminData();
      }
    }

    function addDetailRow() {
      const container = document.getElementById('details-container');
      const opts = (arr) => arr.map(a => `<option value="${a}">${a}</option>`).join('');
      
      let defaultClass = '';
      let defaultDate = '';
      
      if (document.getElementById('copyFirstRow') && document.getElementById('copyFirstRow').checked) {
        const firstRow = container.querySelector('div');
        if (firstRow) {
          defaultClass = firstRow.querySelector('.d-class').value || '';
          defaultDate = firstRow.querySelector('.d-odate').value || '';
        }
      }

      const rowHtml = `
        <div class="p-5 bg-gray-50/50 rounded-2xl border border-gray-200 relative group transition hover:border-gray-300 hover:shadow-sm">
          <button type="button" onclick="removeDetailRow(this)" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 text-sm md:opacity-0 group-hover:opacity-100 transition font-bold bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-100">🗑️ 移除此筆</button>
          
          <div class="mb-4">
            <label class="block text-sm font-bold text-blue-800 mb-2">調課班級</label>
            <select class="d-class border border-gray-200 rounded-xl p-2.5 bg-white w-full md:w-1/3 focus:ring-2 focus:ring-blue-400 focus:outline-none">
                <option value="" disabled selected>請選擇班級</option>
                ${opts(CLASS_OPTIONS)}
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm">
              <span class="text-sm font-bold text-gray-500 mb-3 block border-b border-gray-100 pb-2">【 1. 原本課程 】</span>
              <div class="flex space-x-2 mb-3">
                <input type="date" class="d-odate border border-gray-200 rounded-xl p-2 w-1/2 focus:ring-2 focus:ring-blue-400 focus:outline-none" onchange="updateWeekday(this)">
                <input type="text" placeholder="星期" class="d-oweek bg-gray-50 text-gray-500 border border-gray-200 rounded-xl p-2 w-1/2 focus:outline-none" readonly>
              </div>
              <div class="flex space-x-2">
                <select class="d-operiod border border-gray-200 rounded-xl p-2 w-1/2 bg-white focus:ring-2 focus:ring-blue-400 focus:outline-none"><option value="" disabled selected>原節次</option>${opts(PERIOD_OPTIONS)}</select>
                <select class="d-osubject border border-gray-200 rounded-xl p-2 w-1/2 bg-white focus:ring-2 focus:ring-blue-400 focus:outline-none"><option value="" disabled selected>原科目</option>${opts(SUBJECT_OPTIONS)}</select>
              </div>
            </div>
            
            <div class="p-4 bg-emerald-50/30 border border-emerald-100 rounded-2xl shadow-sm">
              <span class="text-sm font-bold text-emerald-600 mb-3 block border-b border-emerald-100 pb-2">【 2. 調課後課程 】</span>
              <div class="flex space-x-2 mb-3">
                <input type="date" class="d-ndate border border-gray-200 rounded-xl p-2 w-1/2 focus:ring-2 focus:ring-emerald-400 focus:outline-none" onchange="updateWeekday(this)">
                <input type="text" placeholder="星期" class="d-nweek bg-gray-50 text-gray-500 border border-gray-200 rounded-xl p-2 w-1/2 focus:outline-none" readonly>
              </div>
              <div class="flex space-x-2">
                <select class="d-nperiod border border-gray-200 rounded-xl p-2 w-1/2 bg-white focus:ring-2 focus:ring-emerald-400 focus:outline-none"><option value="" disabled selected>調後節次</option>${opts(PERIOD_OPTIONS)}</select>
                <select class="d-nsubject border border-gray-200 rounded-xl p-2 w-1/2 bg-white focus:ring-2 focus:ring-emerald-400 focus:outline-none"><option value="" disabled selected>調後科目</option>${opts(SUBJECT_OPTIONS)}</select>
              </div>
            </div>
          </div>
        </div>`;
      
      container.insertAdjacentHTML('beforeend', rowHtml);
      
      const newRow = container.lastElementChild;
      if (defaultClass) newRow.querySelector('.d-class').value = defaultClass;
      if (defaultDate) {
          const dateInput = newRow.querySelector('.d-odate');
          dateInput.value = defaultDate;
          updateWeekday(dateInput);
      }
    }

    async function removeDetailRow(btnEl) {
      const rows = document.querySelectorAll('#details-container > div');
      if(rows.length > 1) {
        btnEl.closest('div').remove();
      } else {
        await showModal('提示', '至少需填寫一筆調課明細！');
      }
    }

    function updateWeekday(inputEl) {
      const dateVal = inputEl.value;
      const weekInput = inputEl.nextElementSibling;
      if (dateVal && weekInput) {
        const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        weekInput.value = days[new Date(dateVal).getDay()];
      } else if(weekInput) {
        weekInput.value = '';
      }
    }

    async function resetForm(force = false) {
      if (!force) {
        const ans = await showModal('確認', '確定要清空重新填寫嗎？', true);
        if (!ans) return;
      }
      document.getElementById('applicant').value = '';
      document.getElementById('email').value = '';
      document.getElementById('reason').value = '';
      document.getElementById('details-container').innerHTML = '';
      document.getElementById('copyFirstRow').checked = false;
      addDetailRow();
    }

    async function submitForm() {
      const details = Array.from(document.querySelectorAll('#details-container > div')).map(row => ({
        targetClass: row.querySelector('.d-class').value,
        origDate: row.querySelector('.d-odate').value,
        origWeek: row.querySelector('.d-oweek').value,
        origPeriod: row.querySelector('.d-operiod').value,
        origSubject: row.querySelector('.d-osubject').value,
        newDate: row.querySelector('.d-ndate').value,
        newWeek: row.querySelector('.d-nweek').value,
        newPeriod: row.querySelector('.d-nperiod').value,
        newSubject: row.querySelector('.d-nsubject').value
      }));

      const payload = {
        applicant: document.getElementById('applicant').value,
        email: document.getElementById('email').value,
        applyDate: document.getElementById('applyDate').value,
        reason: document.getElementById('reason').value,
        details: details
      };

      if (!payload.applicant) { showModal('提示', '請填寫申請人姓名！'); return; }
      if (!payload.reason) { showModal('提示', '請填寫申請事由！'); return; }
      const isDetailsValid = payload.details.every(d => d.targetClass && d.origDate && d.origPeriod && d.origSubject && d.newDate && d.newPeriod && d.newSubject);
      if (!isDetailsValid) { showModal('提示', '請完整選擇所有調課明細！'); return; }

      showModal('處理中', '資料傳送中，請稍候...', false, true);
      
      try {
        const res = await apiCall('submit', { payload: payload });
        await showModal('結果', res.message);
        if(res.success) {
            resetForm(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } catch(error) {
        await showModal('錯誤', '連線異常，請檢查網路狀態。' + error.message);
      }
    }

    async function adminLogin() {
      const role = document.getElementById('sysRole').value;
      const pwd = document.getElementById('sysPassword').value;
      if (!pwd) { showModal('提示', '請輸入密碼！'); return; }

      showModal('驗證中', '正在驗證身分...', false, true);
      
      try {
        const res = await apiCall('login', { role: role, password: pwd });
        if (res.success) {
          currentRole = res.role;
          document.getElementById('admin-login').classList.add('hidden');
          document.getElementById('admin-dashboard').classList.remove('hidden');
          document.getElementById('custom-modal').classList.add('hidden');
          loadAdminData();
        } else {
          showModal('登入失敗', res.message);
        }
      } catch(error) {
        await showModal('錯誤', '連線異常，請檢查網路狀態。' + error.message);
      }
    }

    function logout() {
      currentRole = null;
      document.getElementById('admin-dashboard').classList.add('hidden');
      document.getElementById('admin-login').classList.remove('hidden');
      document.getElementById('sysPassword').value = '';
    }

    async function loadAdminData() {
      document.getElementById('admin-table-body').innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500">載入中...</td></tr>';
      
      try {
        const data = await apiCall('getAll');
        globalAdminData = data.reverse();
        applyFilters();
      } catch (err) {
        document.getElementById('admin-table-body').innerHTML = `<tr><td colspan="4" class="p-6 text-center text-red-500">無法載入資料，請重新整理。<br>${err.message}</td></tr>`;
      }
    }

    function toggleCustomDate() {
      const timeFilter = document.getElementById('filterTime').value;
      if (timeFilter === 'custom') {
        document.getElementById('customDateContainer').classList.remove('hidden');
      } else {
        document.getElementById('customDateContainer').classList.add('hidden');
      }
    }

    function applyFilters() {
      const timeFilter = document.getElementById('filterTime').value;
      const reasonFilter = document.getElementById('filterReason').value.trim().toLowerCase();
      const keyword = document.getElementById('filterKeyword').value.trim().toLowerCase();
      
      const customStart = document.getElementById('filterStartDate').value;
      const customEnd = document.getElementById('filterEndDate').value;

      const now = new Date();
      
      const filtered = globalAdminData.filter(item => {
        if (reasonFilter !== '' && !item.reason.toLowerCase().includes(reasonFilter)) return false;

        if (keyword !== '') {
          const matchApplicant = item.applicant.toLowerCase().includes(keyword);
          const matchId = item.id.toLowerCase().includes(keyword);
          if (!matchApplicant && !matchId) return false;
        }

        if (timeFilter !== 'all') {
          const dateStr = item.date.split(' ')[0].replace(/-/g, '/');
          const itemDate = new Date(dateStr);
          
          if (!isNaN(itemDate.getTime())) {
            if (timeFilter === 'month') {
              const isSameMonth = itemDate.getFullYear() === now.getFullYear() && itemDate.getMonth() === now.getMonth();
              if (!isSameMonth) return false;
            } else if (timeFilter === 'week') {
              const day = now.getDay();
              const diffToMonday = day === 0 ? -6 : 1 - day;
              const monday = new Date(now);
              monday.setDate(now.getDate() + diffToMonday);
              monday.setHours(0, 0, 0, 0);
              const sunday = new Date(monday);
              sunday.setDate(monday.getDate() + 6);
              sunday.setHours(23, 59, 59, 999);
              if (itemDate < monday || itemDate > sunday) return false;
            } else if (timeFilter === 'custom') {
              if (customStart && itemDate < new Date(customStart)) return false;
              if (customEnd) {
                const endDate = new Date(customEnd);
                endDate.setHours(23, 59, 59, 999);
                if (itemDate > endDate) return false;
              }
            }
          }
        }
        return true;
      });

      renderAdminTable(filtered);
    }

    function renderAdminTable(data) {
      const tbody = document.getElementById('admin-table-body');
      if (data.length === 0) { 
        tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-gray-500">查無符合條件的調課申請資料</td></tr>'; 
        return; 
      }

      tbody.innerHTML = data.map(item => {
        const details = item.details.map(d => `<div class="bg-gray-50 p-2 rounded mb-1 text-xs"><span class="font-bold">${d.targetClass}</span> | 原: ${d.origDate} (${d.origPeriod}/${d.origSubject}) ➔ 改: ${d.newDate} (${d.newPeriod}/${d.newSubject})</div>`).join('');
        
        let dirStatus = '主任待簽';
        let dirColor = 'bg-amber-100 text-amber-700';
        if (item.directorSign.includes('核可')) { dirStatus = '主任已核'; dirColor = 'bg-blue-100 text-blue-700'; }
        else if (item.directorSign.includes('退回') || item.status === '主任退回') { dirStatus = '主任退回'; dirColor = 'bg-red-100 text-red-700'; }

        let prinStatus = '校長待簽';
        let prinColor = 'bg-amber-100 text-amber-700';
        if (item.principalSign.includes('核可')) { prinStatus = '校長已核'; prinColor = 'bg-green-100 text-green-700'; }
        else if (item.principalSign.includes('退回') || item.status === '校長退回') { prinStatus = '校長退回'; prinColor = 'bg-red-100 text-red-700'; }
        
        if (dirStatus === '主任待簽' || dirStatus === '主任退回') {
            prinStatus = '-';
        }

        const badgesHtml = `
            <div class="flex flex-col space-y-1.5">
                <span class="px-2.5 py-1 rounded font-bold text-xs text-center w-max shadow-sm border border-white/50 ${dirColor}">${dirStatus}</span>
                ${prinStatus !== '-' ? `<span class="px-2.5 py-1 rounded font-bold text-xs text-center w-max shadow-sm border border-white/50 ${prinColor}">${prinStatus}</span>` : ''}
            </div>
        `;

        let actions = '<span class="text-gray-400">-</span>';
        
        let rejectReasonText = "";
        if (dirStatus === '主任退回' && item.directorSign.includes('理由：')) {
            rejectReasonText = item.directorSign.substring(item.directorSign.indexOf('理由：') + 3);
        } else if (prinStatus === '校長退回' && item.principalSign.includes('理由：')) {
            rejectReasonText = item.principalSign.substring(item.principalSign.indexOf('理由：') + 3);
        }

        if (rejectReasonText) {
             actions = `<div class="text-xs text-red-600 font-bold bg-red-50 p-2.5 rounded-lg border border-red-100 max-w-[150px] break-words leading-relaxed shadow-sm">退回理由：<br><span class="font-medium text-gray-700 mt-1 block">${rejectReasonText}</span></div>`;
        } else if (currentRole === 'director' && item.status === '待簽核') {
          actions = `<div class="flex space-x-2">
                       <button onclick="signDoc(${item.rowIndex}, 'approve')" class="text-white bg-green-500 px-3 py-1.5 text-xs font-bold rounded shadow-sm hover:bg-green-600">核可</button>
                       <button onclick="signDoc(${item.rowIndex}, 'reject')" class="text-white bg-red-500 px-3 py-1.5 text-xs font-bold rounded shadow-sm hover:bg-red-600">退回</button>
                     </div>`;
        } else if (currentRole === 'principal' && item.status === '主任已核') {
          actions = `<div class="flex space-x-2">
                       <button onclick="signDoc(${item.rowIndex}, 'approve')" class="text-white bg-green-500 px-3 py-1.5 text-xs font-bold rounded shadow-sm hover:bg-green-600">核可</button>
                       <button onclick="signDoc(${item.rowIndex}, 'reject')" class="text-white bg-red-500 px-3 py-1.5 text-xs font-bold rounded shadow-sm hover:bg-red-600">退回</button>
                     </div>`;
        }

        return `
          <tr class="hover:bg-blue-50/40">
            <td class="p-4 align-top">
              <div class="font-bold text-gray-800">${item.applicant}</div>
              <div class="text-xs text-gray-400 mt-1">${item.id}</div>
              <div class="text-xs text-gray-400 mt-0.5">${item.date}</div>
            </td>
            <td class="p-4 align-top"><span class="inline-block px-2.5 py-1 bg-gray-100 text-gray-600 rounded-lg text-xs font-bold mb-2">${item.reason}</span>${details}</td>
            <td class="p-4 align-top">${badgesHtml}</td>
            <td class="p-4 align-top">${actions}</td>
          </tr>
        `;
      }).join('');
    }

    async function signDoc(rowIndex, action) {
      let rejectReason = "";
      
      if (action === 'reject') {
        rejectReason = await showModal('退回申請', '請輸入退回理由：', true, false, true);
        if (rejectReason === false || rejectReason === null) return; 
        if (!rejectReason.trim()) {
          await showModal('提示', '退回理由不能為空！');
          return;
        }
      } else {
        const isConfirm = await showModal('確認', '確定要核可此申請嗎？', true);
        if (!isConfirm) return;
      }

      showModal('處理中', '簽核更新中...', false, true);
      
      try {
        const res = await apiCall('updateSign', {
          rowIndex: rowIndex,
          role: currentRole,
          signAction: action,
          rejectReason: rejectReason
        });
        await showModal('結果', res.message);
        if(res.success) loadAdminData();
      } catch (error) {
        await showModal('錯誤', '連線異常，請檢查網路狀態。' + error.message);
      }
    }

    document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];
    addDetailRow();
  </script>
</body>
</html>
